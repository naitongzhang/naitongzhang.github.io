name: Update UAE index data

on:
  # Run daily at 12:30 UTC (16:30 Dubai time, after market close).
  schedule:
    - cron: '30 12 * * 1-5'
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write   # required to push commits back

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-uae-index-${{ hashFiles('scripts/uae-index/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-uae-index-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/uae-index/requirements.txt

      - name: Fetch latest UAE market data
        run: |
          python scripts/uae-index/run_all.py

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/uae/
          # Only commit if there are real changes.
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          COMMIT_MSG="chore(data): refresh UAE market data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "$COMMIT_MSG"
          git push